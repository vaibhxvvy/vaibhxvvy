name: Metrics Heatmaps

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
          filename: metrics/metrics.svg
          base: header, activity, community, repositories, metadata
          base_indepth: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          plugin_isocalendar_skipped: "1"
          plugin_skyline: yes
          plugin_skyline_settings: "yearly"
          plugin_calendar: yes
          plugin_calendar_limit: 2
          plugin_languages: yes
          plugin_languages_skipped: "1"
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: no
          config_timezone: Asia/Kolkata
