name: Pacman Heatmap

on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: vaibhxvvy
          games: 'pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper'

      - name: Commit pacman graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "chore: update pacman heatmap"
          git push
