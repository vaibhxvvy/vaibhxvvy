name: Real Ripple Heatmap

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate real-data ripple
        run: |
          cat > gen.py << 'PY'
          import json, urllib.request, pathlib, math, random
          url = "https://github-contributions-api.jogruber.de/v4/vaibhxvvy?y=last"
          data = json.loads(urllib.request.urlopen(url, timeout=15).read().decode())
          contribs = data.get("contributions", [])
          palette = ['#161B22','#7A5CFA','#00D9FF','#3ECF8E','#FFB86C']
          W,H=722,112
          cols, rows = 53, 7
          cell=10
          gap=3
          sx=0
          sy=0
          cx, cy = cols//2, rows//2
          parts=[]
          parts.append(f'<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img">')
          parts.append('<title>Fullsize 2D Ripple — Colourful Real Data — Original Size</title>')
          parts.append('<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>')
          parts.append(f'<rect width="{W}" height="{H}" rx="3" fill="#0d1117"/>')
          if len(contribs)>cols*rows:
              contribs=contribs[-cols*rows:]
          elif len(contribs)<cols*rows:
              contribs=[{"level":0,"count":0,"date":""}]*(cols*rows-len(contribs))+contribs
          for idx,c in enumerate(contribs):
              col=idx//7
              row=idx%7
              lvl=max(0,min(4,int(c.get("level",0))))
              color=palette[lvl]
              x=sx+col*(cell+gap)
              y=sy+row*(cell+gap)
              dist=math.hypot(col-cx,row-cy)
              delay=dist*0.08+random.random()*0.02
              glow=' filter="url(#glow)"' if lvl>=3 else ''
              date=c.get("date","")
              cnt=c.get("count",0)
              parts.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="2" fill="{color}"{glow} opacity="0"><title>{date}: {cnt} level {lvl}</title><animate attributeName="opacity" values="0;1" dur="0.32s" begin="{delay:.2f}s" fill="freeze"/></rect>')
          parts.append('</svg>')
          pathlib.Path("assets/full-2d-ripple.svg").write_text("\n".join(parts), encoding="utf-8")
          print(f"written {len(contribs)} cells")
          PY
          python3 gen.py

      - name: Commit ripple
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/full-2d-ripple.svg
          git diff --staged --quiet || git commit -m "chore: update real ripple heatmap"
          git push

      - name: Install font tools
        run: pip install fonttools

      - name: Refresh contribution and repo data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data
          curl -fsS --retry 3 --retry-delay 5 -m 30 \
            "https://github-contributions-api.jogruber.de/v4/${GITHUB_REPOSITORY_OWNER}?y=last" \
            -o data/contributions.new
          python3 -c "import json; d=json.load(open('data/contributions.new')); assert len(d['contributions']) > 300, 'too few days'"
          mv data/contributions.new data/contributions.json
          : > data/repos.ndjson
          while read -r r; do
            [ -n "$r" ] || continue
            if out=$(gh api "repos/${GITHUB_REPOSITORY_OWNER}/$r" 2>/dev/null); then
              echo "$out" | jq --arg n "$r" \
                '{($n): {description, language, stargazers_count, forks_count, pushed_at}}' \
                >> data/repos.ndjson
            else
              echo "skipping $r (not readable)"
            fi
          done < data/featured.txt
          jq -s 'add // {}' data/repos.ndjson > data/repos.json
          rm data/repos.ndjson
          gh api "users/${GITHUB_REPOSITORY_OWNER}" --jq '{public_repos}' > data/profile.json

      - name: Render profile cards
        run: python3 scripts/build_cards.py

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards data
          git diff --staged --quiet || git commit -m "chore: refresh profile cards"
          git push
