name: Real Ripple Heatmap

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate real-data ripple
        run: |
          cat > gen.py << 'PY'
          import json, urllib.request, pathlib, math, random
          url = "https://github-contributions-api.jogruber.de/v4/vaibhxvvy?y=last"
          data = json.loads(urllib.request.urlopen(url, timeout=15).read().decode())
          contribs = data.get("contributions", [])
          palette = ['#1C1E2A','#23263A','#2A2E45','#7A5CFA','#00D9FF']
          W,H=800,170
          cols, rows = 53, 7
          cell=9
          gap=2
          sx=18
          sy=34
          cx, cy = cols//2, rows//2
          svg=[]
          svg.append(f'''<svg xmlns="http://www.w3.org/2000/svg" width="{W}" height="{H}" viewBox="0 0 {W} {H}" role="img">
          <title>Fullsize 2D Ripple — Real Data</title>
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
            <style>.lab {{ font-family: JetBrains Mono,monospace; font-size: 8px; fill: #8B8DA3; }}</style>
          </defs>
          <rect width="{W}" height="{H}" rx="14" fill="#11131A" stroke="#1C1E2A"/>
          <text x="18" y="20" font-family="JetBrains Mono,monospace" font-size="10" fill="#8B8DA3">FULLSIZE 2D RIPPLE — REAL DATA · 53 WEEKS · {len(contribs)} DAYS · {data.get('total',{{}}).get('lastYear',0)} CONTRIBS LAST YEAR</text>
          <text x="18" y="32" font-family="JetBrains Mono,monospace" font-size="8" fill="#8B8DA3">levels 0–4 from GitHub API · center → edges ripple · violet → cyan</text>
          ''')
          if len(contribs) > cols*rows:
              contribs = contribs[-cols*rows:]
          elif len(contribs) < cols*rows:
              pad = cols*rows - len(contribs)
              contribs = [{"level":0,"count":0,"date":""}]*pad + contribs
          import math, random
          for idx, c in enumerate(contribs):
              col = idx // 7
              row = idx % 7
              lvl = int(c.get("level",0))
              lvl = max(0, min(4, lvl))
              color = palette[lvl]
              x = sx + col*(cell+gap)
              y = sy + row*(cell+gap)
              dist = math.hypot(col-cx, row-cy)
              delay = dist*0.04 + random.random()*0.02
              glow = ' filter="url(#glow)"' if lvl>=3 else ''
              date = c.get("date","")
              cnt = c.get("count",0)
              svg.append(f'<rect x="{x}" y="{y}" width="{cell}" height="{cell}" rx="1.8" fill="{color}"{glow} opacity="0"><title>{date}: {cnt}</title><animate attributeName="opacity" values="0;1" dur="0.32s" begin="{delay:.2f}s" fill="freeze"/><animate attributeName="width" values="{cell};{cell+0.8};{cell}" dur="1.5s" begin="{delay+0.9:.2f}s" repeatCount="indefinite"/></rect>')
          months={}
          for idx,c in enumerate(contribs):
              d=c.get("date","")
              if d:
                  m=d[5:7]
                  col= idx//7
                  if m not in months:
                      months[m]=col
          names={"01":"Jan","02":"Feb","03":"Mar","04":"Apr","05":"May","06":"Jun","07":"Jul","08":"Aug","09":"Sep","10":"Oct","11":"Nov","12":"Dec"}
          for m,col in sorted(months.items()):
              mx = sx + col*(cell+gap)
              svg.append(f'<text x="{mx}" y="{sy + 7*(cell+gap)+12}" class="lab">{names.get(m,m)}</text>')
          svg.append(f'<text x="18" y="{sy+10}" class="lab">Sun</text><text x="18" y="{sy+32}" class="lab">Wed</text><text x="18" y="{sy+54}" class="lab">Sat</text>')
          svg.append('<line x1="18" y1="155" x2="782" y2="155" stroke="#1C1E2A" stroke-width="0.7" opacity="0.6"/>')
          svg.append('<text x="18" y="166" class="lab">53 WEEKS · 7 DAYS · REAL QUARTILES · RIPPLE CENTER → EDGES</text>')
          svg.append(f'<text x="{W-18}" y="166" text-anchor="end" class="lab">{len(contribs)} days · violet → cyan · live API</text>')
          svg.append('</svg>')
          pathlib.Path("assets/full-2d-ripple.svg").write_text("\n".join(svg), encoding="utf-8")
          print(f"written {len(contribs)} cells")
          PY
          python3 gen.py

      - name: Commit ripple
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/full-2d-ripple.svg
          git diff --staged --quiet || git commit -m "chore: update real ripple heatmap"
          git push
