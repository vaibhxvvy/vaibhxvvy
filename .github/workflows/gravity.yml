name: Gravity Heatmap

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: flycran/github-gravity@v1
        with:
          username: vaibhxvvy
          text: vaibhxvvy
          output-path: assets/gravity.svg
          background-color: "#11131A"
          text-color: "#7A5CFA"
          shape: circle

      - name: Commit gravity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/gravity.svg
          git diff --staged --quiet || git commit -m "chore: update gravity heatmap"
          git push
