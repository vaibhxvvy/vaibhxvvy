<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img">
<title>Ad — Pipelines That Ship</title>
<defs>
  <linearGradient id="ad1" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7A5CFA"/><stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>
  <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6" result="b"/><feComposite in="SourceGraphic" in2="b" operator="over"/></filter>
  <style>
    .mono { font-family: 'JetBrains Mono',monospace; }
  </style>
</defs>
<!-- bg -->
<rect width="800" height="220" rx="16" fill="#0A0A0F" stroke="#1C1E2A"/>
<rect width="800" height="220" rx="16" fill="none" stroke="url(#ad1)" stroke-width="0.9" opacity="0.45"/>
<!-- grid subtle -->
<g opacity="0.07" stroke="#8B8DA3" stroke-width="0.6">
  <line x1="40" y1="60" x2="760" y2="60"/><line x1="40" y1="110" x2="760" y2="110"/><line x1="40" y1="160" x2="760" y2="160"/>
  <line x1="260" y1="16" x2="260" y2="204"/><line x1="520" y1="16" x2="520" y2="204"/>
</g>
<!-- left copy -->
<text x="40" y="46" class="mono" font-size="10" fill="#00D9FF" letter-spacing="1.8">FOR TEAMS TIRED OF NOTEBOOKS</text>
<text x="40" y="78" font-family="JetBrains Mono,monospace" font-size="26" font-weight="800" fill="#E8E8EE">STOP TRAINING.</text>
<text x="40" y="108" font-family="JetBrains Mono,monospace" font-size="26" font-weight="800" fill="url(#ad1)">START SHIPPING.</text>
<g>
  <rect x="40" y="118" width="0" height="3" rx="1.5" fill="url(#ad1)">
    <animate attributeName="width" values="0;312;312" dur="2.2s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1;1"/>
  </rect>
  <rect x="40" y="118" width="312" height="3" rx="1.5" fill="white" opacity="0.18">
    <animate attributeName="x" values="40;352;40" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.18;0;0.18" dur="2.8s" begin="1.8s" repeatCount="indefinite"/>
  </rect>
</g>
<text x="40" y="140" class="mono" font-size="11.5" fill="#8B8DA3">Pipelines → decisions. Not just models.</text>
<text x="40" y="158" class="mono" font-size="11" fill="#8B8DA3">latency <tspan fill="#E8E8EE">42ms</tspan>  ·  cost <tspan fill="#3ECF8E">$0.004/1k</tspan>  ·  drift <tspan fill="#00D9FF">0.02</tspan></text>
<!-- CTA -->
<g>
  <rect x="40" y="172" width="148" height="28" rx="999" fill="url(#ad1)"/>
  <text x="114" y="190.5" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#0A0A0F">Let&apos;s Build →</text>
  <rect x="40" y="172" width="148" height="28" rx="999" fill="none" stroke="white" stroke-opacity="0.0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="1.6s" repeatCount="indefinite"/>
  </rect>
</g>
<!-- right visual — mini pipeline card -->
<g transform="translate(420,28)">
  <rect width="340" height="164" rx="14" fill="#11131A" stroke="#1C1E2A"/>
  <!-- flow line -->
  <line x1="28" y1="82" x2="312" y2="82" stroke="#1C1E2A" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="82" x2="312" y2="82" stroke="url(#ad1)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 9">
    <animate attributeName="stroke-dashoffset" values="0;-32" dur="0.85s" repeatCount="indefinite"/>
  </line>
  <!-- nodes -->
  <g>
    <rect x="12" y="62" width="56" height="40" rx="8" fill="#0A0A0F" stroke="#7A5CFA"/>
    <text x="40" y="82" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7" font-weight="700" fill="#E8E8EE">ING</text>
    <text x="40" y="90" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#8B8DA3">api</text>
    <circle cx="40" cy="58" r="2.5" fill="#7A5CFA"><animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/></circle>
  </g>
  <g>
    <rect x="102" y="62" width="56" height="40" rx="8" fill="#0A0A0F" stroke="#23263A"/>
    <text x="130" y="82" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7" font-weight="700" fill="#8B8DA3">VAL</text>
    <text x="130" y="90" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#8B8DA3">chk</text>
  </g>
  <g filter="url(#glow1)">
    <rect x="192" y="56" width="64" height="52" rx="10" fill="#0A0A0F" stroke="url(#ad1)" stroke-width="1.3"/>
    <text x="224" y="82" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="8" font-weight="800" fill="#E8E8EE">MODEL</text>
    <text x="224" y="92" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#7A5CFA">0.87</text>
  </g>
  <g>
    <rect x="270" y="62" width="56" height="40" rx="8" fill="#0A0A0F" stroke="#00D9FF" stroke-opacity="0.9"/>
    <text x="298" y="82" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="7" font-weight="700" fill="#E8E8EE">OUT</text>
    <text x="298" y="90" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="6" fill="#00D9FF">live</text>
    <circle cx="298" cy="58" r="2.5" fill="#00D9FF"><animate attributeName="opacity" values="1;0.3;1" dur="1s" begin="0.5s" repeatCount="indefinite"/></circle>
  </g>
  <!-- moving dot -->
  <circle r="4.5" fill="#E8E8EE"><animateMotion path="M40,82 L298,82" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle r="2" fill="#0A0A0F"><animateMotion path="M40,82 L298,82" dur="2.4s" repeatCount="indefinite"/></circle>
  <!-- metric -->
  <text x="28" y="132" font-family="JetBrains Mono,monospace" font-size="9" fill="#8B8DA3">deploy: <tspan fill="#3ECF8E">canary 20%</tspan>  rollback → <tspan fill="#7A5CFA">auto</tspan></text>
  <text x="28" y="148" font-family="JetBrains Mono,monospace" font-size="9" fill="#8B8DA3">→ <tspan fill="#E8E8EE">vaibhxvvy</tspan> / pipeline-42</text>
</g>
</svg>
