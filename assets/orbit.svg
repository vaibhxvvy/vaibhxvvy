<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220" role="img">
<title>Orbit — stack ecosystem</title>
<defs>
  <radialGradient id="core" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7A5CFA" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#0A0A0F" stop-opacity="0"/>
  </radialGradient>
  <style>
    .ring { fill: none; stroke: #1C1E2A; stroke-width: 1.1; }
    .ring2 { fill: none; stroke: #1C1E2A; stroke-width: 0.9; stroke-dasharray: 4 8; }
  </style>
</defs>
<!-- core -->
<circle cx="400" cy="110" r="52" fill="url(#core)" opacity="0.9"/>
<circle cx="400" cy="110" r="18" fill="#11131A" stroke="#7A5CFA" stroke-width="1.2"/>
<text x="400" y="115" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" font-weight="700" fill="#E8E8EE">CORE</text>

<!-- rings -->
<circle cx="400" cy="110" r="52" class="ring"/>
<circle cx="400" cy="110" r="84" class="ring2"/>
<circle cx="400" cy="110" r="106" class="ring" opacity="0.55"/>

<!-- orbiting nodes — manual animateTransform orbits -->
<g>
  <!-- inner ring 2 nodes -->
  <g>
    <circle r="9" fill="#11131A" stroke="#7A5CFA" stroke-width="1.1"/>
    <text text-anchor="middle" dy="3.5" font-family="JetBrains Mono,monospace" font-size="7" fill="#E8E8EE">PY</text>
    <animateTransform attributeName="transform" type="rotate" from="0 400 110" to="360 400 110" dur="9s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="52 0;52 0" dur="9s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="9" fill="#11131A" stroke="#00D9FF" stroke-width="1.1"/>
    <text text-anchor="middle" dy="3.5" font-family="JetBrains Mono,monospace" font-size="7" fill="#E8E8EE">TS</text>
    <animateTransform attributeName="transform" type="rotate" from="180 400 110" to="540 400 110" dur="9s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="52 0;52 0" dur="9s" repeatCount="indefinite"/>
  </g>
  <!-- middle ring 3 nodes -->
  <g>
    <circle r="8" fill="#11131A" stroke="#1C1E2A" stroke-width="1"/>
    <text text-anchor="middle" dy="3" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#8B8DA3">PT</text>
    <animateTransform attributeName="transform" type="rotate" from="0 400 110" to="360 400 110" dur="14s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="84 0;84 0" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="8" fill="#11131A" stroke="#1C1E2A" stroke-width="1"/>
    <text text-anchor="middle" dy="3" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#8B8DA3">DB</text>
    <animateTransform attributeName="transform" type="rotate" from="120 400 110" to="480 400 110" dur="14s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="84 0;84 0" dur="14s" repeatCount="indefinite"/>
  </g>
  <g>
    <circle r="8" fill="#11131A" stroke="#1C1E2A" stroke-width="1"/>
    <text text-anchor="middle" dy="3" font-family="JetBrains Mono,monospace" font-size="6.5" fill="#8B8DA3">TF</text>
    <animateTransform attributeName="transform" type="rotate" from="240 400 110" to="600 400 110" dur="14s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="84 0;84 0" dur="14s" repeatCount="indefinite"/>
  </g>
  <!-- outer slow ring -->
  <g>
    <circle r="7" fill="#0A0A0F" stroke="#23263A" stroke-width="0.9"/>
    <text text-anchor="middle" dy="2.5" font-family="JetBrains Mono,monospace" font-size="6" fill="#8B8DA3">⋆</text>
    <animateTransform attributeName="transform" type="rotate" from="0 400 110" to="360 400 110" dur="22s" repeatCount="indefinite"/>
    <animateTransform additive="sum" attributeName="transform" type="translate" values="106 0;106 0" dur="22s" repeatCount="indefinite"/>
  </g>
</g>

<!-- side labels -->
<text x="18" y="20" font-family="JetBrains Mono,monospace" font-size="10" fill="#8B8DA3">ECOSYSTEM · ORBIT</text>
<text x="18" y="36" font-family="JetBrains Mono,monospace" font-size="10" fill="#E8E8EE">stack gravitates to the system core</text>
<text x="782" y="206" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="9" fill="#8B8DA3">PY · TS orbit fast · DB/TF slow</text>
</svg>
