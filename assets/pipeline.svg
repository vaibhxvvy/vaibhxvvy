<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" role="img" aria-labelledby="title desc">
<title id="title">Data Pipeline — Ingest to Monitor</title>
<desc id="desc">Animated pipeline: Ingest → Validate → Model → Deploy → Monitor</desc>
<defs>
  <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7A5CFA"/>
    <stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>
  <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#7A5CFA" stop-opacity="0.0"/>
    <stop offset="50%" stop-color="#7A5CFA" stop-opacity="1"/>
    <stop offset="100%" stop-color="#00D9FF" stop-opacity="0.0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feComposite in="SourceGraphic" in2="blur" operator="over"/>
  </filter>
  <style>
    .node { fill: #11131A; stroke: #1C1E2A; stroke-width: 1.2; rx: 12; }
    .node-active { stroke: url(#g); stroke-width: 1.4; }
    .label { font-family: 'Fira Code', 'Geist Mono', monospace; font-size: 11px; font-weight: 600; fill: #E8E8EE; text-anchor: middle; letter-spacing: 0.6px; }
    .sub { font-family: 'Inter', system-ui, sans-serif; font-size: 8.5px; fill: #8B8DA3; text-anchor: middle; letter-spacing: 0.3px; }
    .track { stroke: #1C1E2A; stroke-width: 2; stroke-linecap: round; }
    .flow { stroke: url(#g); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 8 10; stroke-dashoffset: 0; }
  </style>
</defs>

<!-- bg grid subtle -->
<g opacity="0.25">
  <line x1="0" y1="65" x2="800" y2="65" stroke="#1C1E2A" stroke-width="0.6" stroke-dasharray="3 8"/>
</g>

<!-- Tracks -->
<line class="track" x1="108" y1="65" x2="212" y2="65"/>
<line class="track" x1="268" y1="65" x2="372" y2="65"/>
<line class="track" x1="428" y1="65" x2="532" y2="65"/>
<line class="track" x1="588" y1="65" x2="692" y2="65"/>

<!-- Animated flows -->
<line class="flow" x1="108" y1="65" x2="212" y2="65">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.9s" repeatCount="indefinite"/>
</line>
<line class="flow" x1="268" y1="65" x2="372" y2="65">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.9s" begin="0.15s" repeatCount="indefinite"/>
</line>
<line class="flow" x1="428" y1="65" x2="532" y2="65">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.9s" begin="0.3s" repeatCount="indefinite"/>
</line>
<line class="flow" x1="588" y1="65" x2="692" y2="65">
  <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="0.9s" begin="0.45s" repeatCount="indefinite"/>
</line>

<!-- Nodes -->
<g>
  <rect class="node node-active" x="20" y="36" width="88" height="58" />
  <text class="label" x="64" y="62">INGEST</text>
  <text class="sub" x="64" y="75">raw • stream</text>
  <circle cx="64" cy="38" r="3" fill="url(#g)"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect class="node node-active" x="212" y="36" width="88" height="58" />
  <text class="label" x="256" y="62">VALIDATE</text>
  <text class="sub" x="256" y="75">clean • schema</text>
  <circle cx="256" cy="38" r="3" fill="url(#g)"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.3s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect class="node" x="372" y="30" width="88" height="70" filter="url(#glow)" style="stroke:url(#g);stroke-width:1.6"/>
  <text class="label" x="416" y="58">MODEL</text>
  <text class="sub" x="416" y="70">train • eval</text>
  <text class="sub" x="416" y="80" fill="#7A5CFA" font-weight="600">core</text>
</g>
<g>
  <rect class="node node-active" x="532" y="36" width="88" height="58" />
  <text class="label" x="576" y="62">DEPLOY</text>
  <text class="sub" x="576" y="75">ship • scale</text>
  <circle cx="576" cy="38" r="3" fill="#00D9FF"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.6s" repeatCount="indefinite"/></circle>
</g>
<g>
  <rect class="node node-active" x="692" y="36" width="88" height="58" />
  <text class="label" x="736" y="62">MONITOR</text>
  <text class="sub" x="736" y="75">observe • loop</text>
  <circle cx="736" cy="38" r="3" fill="#00D9FF"><animate attributeName="opacity" values="1;0.35;1" dur="1.6s" begin="0.9s" repeatCount="indefinite"/></circle>
</g>

<!-- moving dot -->
<circle r="4" fill="#E8E8EE">
  <animateMotion path="M64,65 L736,65" dur="3.2s" repeatCount="indefinite" rotate="auto"/>
  <animate attributeName="opacity" values="1;1;0" dur="3.2s" repeatCount="indefinite"/>
</circle>
<circle r="2.2" fill="#0A0A0F" >
  <animateMotion path="M64,65 L736,65" dur="3.2s" repeatCount="indefinite"/>
  <animate attributeName="opacity" values="1;1;0" dur="3.2s" repeatCount="indefinite"/>
</circle>
</svg>
