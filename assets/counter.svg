<svg xmlns="http://www.w3.org/2000/svg" width="800" height="92" viewBox="0 0 800 92" role="img">
<title>Counts</title>
<defs>
  <style>
    .box { fill: #11131A; stroke: #1C1E2A; stroke-width: 1; rx: 12; }
    .num { font-family: 'JetBrains Mono',monospace; font-size: 28px; font-weight: 800; fill: #E8E8EE; text-anchor: middle; }
    .lab { font-family: 'JetBrains Mono',monospace; font-size: 10px; fill: #8B8DA3; text-anchor: middle; letter-spacing: 0.6px; }
  </style>
</defs>
<g>
  <rect x="12" y="10" width="188" height="72" rx="12" class="box"/>
  <text x="106" y="42" class="num">12<tspan fill="#7A5CFA">+</tspan></text>
  <text x="106" y="60" class="lab">REPOS SHIPPED</text>
  <rect x="12" y="10" width="188" height="72" rx="12" fill="none" stroke="#7A5CFA" stroke-opacity="0.0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="2.4s" begin="0.4s" repeatCount="indefinite"/>
  </rect>
</g>
<g>
  <rect x="212" y="10" width="188" height="72" rx="12" class="box"/>
  <text x="306" y="42" class="num">3<tspan fill="#00D9FF">★</tspan></text>
  <text x="306" y="60" class="lab">TOP: DOCS-PRO</text>
  <rect x="212" y="10" width="188" height="72" rx="12" fill="none" stroke="#00D9FF" stroke-opacity="0.0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="2.4s" begin="0.9s" repeatCount="indefinite"/>
  </rect>
</g>
<g>
  <rect x="412" y="10" width="188" height="72" rx="12" class="box"/>
  <text x="506" y="42" class="num">24<tspan fill="#7A5CFA" font-size="16">h</tspan></text>
  <text x="506" y="60" class="lab">HEATMAP REFRESH</text>
  <rect x="412" y="10" width="188" height="72" rx="12" fill="none" stroke="#7A5CFA" stroke-opacity="0.0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="2.4s" begin="1.4s" repeatCount="indefinite"/>
  </rect>
</g>
<g>
  <rect x="612" y="10" width="176" height="72" rx="12" class="box"/>
  <text x="700" y="42" class="num">∞</text>
  <text x="700" y="60" class="lab">ITERATION</text>
  <rect x="612" y="10" width="176" height="72" rx="12" fill="none" stroke="#00D9FF" stroke-opacity="0.0">
    <animate attributeName="stroke-opacity" values="0;0.35;0" dur="2.4s" begin="1.9s" repeatCount="indefinite"/>
  </rect>
</g>
</svg>
