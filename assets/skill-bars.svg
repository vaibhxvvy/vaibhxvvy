<svg xmlns="http://www.w3.org/2000/svg" width="800" height="210" viewBox="0 0 800 210" role="img">
<title>Skills — animated bars</title>
<defs>
  <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7A5CFA"/>
    <stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>
  <style>
    .bg { fill: #1C1E2A; }
    .label { font-family: 'JetBrains Mono',monospace; font-size: 11px; fill: #E8E8EE; letter-spacing: 0.4px; }
    .pct { font-family: 'JetBrains Mono',monospace; font-size: 11px; fill: #8B8DA3; text-anchor: end; }
    .track { fill: #11131A; stroke: #1C1E2A; stroke-width: 0.8; rx: 6; }
  </style>
</defs>

<!-- 6 bars: label, track, fill animating -->
<g>
  <!-- Python 94% -->
  <text x="18" y="26" class="label">Python</text>
  <text x="782" y="26" class="pct">94%</text>
  <rect x="18" y="34" width="764" height="12" rx="6" class="track"/>
  <rect x="18" y="34" width="0" height="12" rx="6" fill="url(#bar)">
    <animate attributeName="width" values="0;718" dur="1.1s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <!-- TypeScript 82% -->
  <text x="18" y="68" class="label">TypeScript</text>
  <text x="782" y="68" class="pct">82%</text>
  <rect x="18" y="76" width="764" height="12" rx="6" class="track"/>
  <rect x="18" y="76" width="0" height="12" rx="6" fill="url(#bar)" opacity="0.92">
    <animate attributeName="width" values="0;626" dur="1.1s" begin="0.35s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <!-- PyTorch / ML 88% -->
  <text x="18" y="110" class="label">PyTorch · ML</text>
  <text x="782" y="110" class="pct">88%</text>
  <rect x="18" y="118" width="764" height="12" rx="6" class="track"/>
  <rect x="18" y="118" width="0" height="12" rx="6" fill="url(#bar)" opacity="0.96">
    <animate attributeName="width" values="0;672" dur="1.1s" begin="0.5s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <!-- Data · SQL 85% -->
  <text x="18" y="152" class="label">Data · SQL</text>
  <text x="782" y="152" class="pct">85%</text>
  <rect x="18" y="160" width="764" height="12" rx="6" class="track"/>
  <rect x="18" y="160" width="0" height="12" rx="6" fill="url(#bar)" opacity="0.88">
    <animate attributeName="width" values="0;649" dur="1.1s" begin="0.65s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
  <!-- Systems · Deploy 80% -->
  <text x="18" y="194" class="label">Systems · Deploy</text>
  <text x="782" y="194" class="pct">80%</text>
  <rect x="18" y="202" width="764" height="3" rx="1.5" class="track"/>
  <rect x="18" y="202" width="0" height="3" rx="1.5" fill="url(#bar)" opacity="0.8">
    <animate attributeName="width" values="0;611" dur="1.1s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1" keyTimes="0;1"/>
  </rect>
</g>
<!-- subtle shimmer -->
<rect x="18" y="34" width="764" height="12" rx="6" fill="none" stroke="white" stroke-opacity="0.05"/>
</svg>
